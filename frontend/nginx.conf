server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # index.html references the current build's hashed JS/CSS filenames, so it must never
    # be served stale — always revalidate it. The hashed bundle files it points to (below)
    # are safe to cache aggressively, since a new build gets new filenames.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite build output (dist/assets/) is content-hashed — a changed file always gets a
    # new filename, so these are safe to cache aggressively for as long as the browser likes.
    # Unhashed static files (favicon.svg, icons.svg, served as-is from public/) are NOT
    # matched here, and fall through to the default location / above, since caching them
    # long-term would reintroduce the same staleness problem if their content ever changes.
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api {
        proxy_pass https://ilmoportaali-app.graysand-8ea0ea6e.swedencentral.azurecontainerapps.io;
        proxy_set_header Host ilmoportaali-app.graysand-8ea0ea6e.swedencentral.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }
}